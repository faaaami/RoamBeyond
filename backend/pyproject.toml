[project]
name = "roambeyond-backend"
version = "0.1.0"
description = "Django API for the Roam Beyond travel agency website."
requires-python = ">=3.13"

# PEP 735 dependency groups. This is an application, not a library, so it is
# installed with `pip install --group dev` (or `uv sync --group dev`), not `pip install .`.
[dependency-groups]
prod = [
  "django~=6.1.3",
  "djangorestframework~=3.18.3",
  "django-cors-headers~=4.9.0",
  "django-environ~=0.14.0",
  "django-anymail[resend]~=15.2",
  "drf-spectacular~=0.30.0",
  "psycopg[binary]~=3.3.9",
  "redis~=7.0",
  "gunicorn~=27.0.1",
  "whitenoise~=6.12.0",
  "pillow~=13.0",
  "django-storages[s3]~=1.14.6",
  "djangorestframework-simplejwt~=5.5.1",
]
dev = [
  { include-group = "prod" },
  "pytest~=9.0",
  "pytest-django~=4.14.0",
  "ruff~=0.17.5",
  "mypy",
  "django-stubs[compatible-mypy]~=6.1.2",
  "djangorestframework-stubs",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "DJ",       # flake8-django
  "SIM",      # simplify
  "C4",       # comprehensions
  "T20",      # no stray print()
  "RUF",
]
ignore = ["RUF012"]  # mutable class attributes are idiomatic in Django/DRF

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
django = ["django", "rest_framework"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:apps", "error::DeprecationWarning:config"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict_optional = true
warn_unused_ignores = true
exclude = ["migrations/", ".venv/"]

[[tool.mypy.overrides]]
module = ["environ.*", "anymail.*", "corsheaders.*", "drf_spectacular.*", "storages.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
