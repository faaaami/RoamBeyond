# Local development stack: Postgres + Redis + the API with live reload.
#   docker compose up --build
# The API is then at http://localhost:8000 and the admin at /admin/.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roambeyond
      POSTGRES_USER: roambeyond
      POSTGRES_PASSWORD: roambeyond
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roambeyond -d roambeyond"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://roambeyond:roambeyond@db:5432/roambeyond
      CACHE_URL: redis://redis:6379/1
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # The Next.js dev server runs on the host, not in compose.
      FRONTEND_REVALIDATE_URL: http://host.docker.internal:3000/api/revalidate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
