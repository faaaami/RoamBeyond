# Runs on every push and pull request. A change is only mergeable when every job passes.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests, deploy check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: roambeyond
          POSTGRES_USER: roambeyond
          POSTGRES_PASSWORD: roambeyond
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roambeyond -d roambeyond"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://roambeyond:roambeyond@localhost:5432/roambeyond
      CACHE_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group dev
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy .
      - name: Tests
        run: pytest -q
      - name: Deploy check (production settings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production-0123456789abcdefgh
          JWT_SIGNING_KEY: ci-only-jwt-key-not-used-in-production-0123456789abcdefgh
          DJANGO_ALLOWED_HOSTS: example.com
          CORS_ALLOWED_ORIGINS: https://example.com
          RESEND_API_KEY: ci-placeholder
          CACHE_URL: redis://localhost:6379/0
          TRUST_PROXY_HEADERS: "false"
        run: python manage.py check --deploy

  frontend:
    name: Website (types, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npm run lint

  build:
    name: Website production build
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: roambeyond
          POSTGRES_USER: roambeyond
          POSTGRES_PASSWORD: roambeyond
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roambeyond -d roambeyond"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://roambeyond:roambeyond@localhost:5432/roambeyond
      # The site pre-renders its pages from the API, so a running backend is needed.
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Start the backend with seeded content
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --group dev
          python manage.py migrate --no-input
          python manage.py runserver 8000 > backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health/ && break; sleep 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build

  docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t roambeyond-api:ci backend
