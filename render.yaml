# Render Blueprint: creates the API, its PostgreSQL database and its Redis cache.
# Import it in Render: New + -> Blueprint -> pick this repository.
# Values marked sync: false are entered in the Render dashboard; they are never stored here.
services:
  - type: web
    name: roambeyond-api
    runtime: docker
    rootDir: backend
    # Both paths are relative to the repository root.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/
    # Migrations run once per deploy, before the new version starts serving traffic.
    preDeployCommand: python manage.py migrate --no-input
    envVars:
      - key: PORT
        value: "8000"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: roambeyond-db
          property: connectionString
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: roambeyond-cache
          property: connectionString
      # Render's load balancer sits in front of the API, so client IPs come from X-Forwarded-For.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false          # the API's address, e.g. roambeyond-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # the website's address, e.g. https://your-site.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        sync: false          # same as CORS_ALLOWED_ORIGINS
      - key: ADMIN_PANEL_URL
        sync: false          # e.g. https://your-site.vercel.app/admin
      - key: FRONTEND_URL
        sync: false          # e.g. https://your-site.vercel.app
      - key: FRONTEND_REVALIDATE_URL
        sync: false          # e.g. https://your-site.vercel.app/api/revalidate
      - key: FRONTEND_REVALIDATE_SECRET
        sync: false          # must equal REVALIDATE_SECRET in Vercel
      - key: RESEND_API_KEY
        sync: false          # enquiry emails; the API refuses to start without it

databases:
  - name: roambeyond-db
    databaseName: roambeyond
    plan: basic-256mb        # free PostgreSQL databases on Render expire after 30 days
  # Redis-compatible cache. Render declares Key Value instances as services of type keyvalue.
  - type: keyvalue
    name: roambeyond-cache
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []          # required; empty: only services in this account can connect
